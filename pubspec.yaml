name: boring
description: High-performance cryptography and PKI powered by BoringSSL with Dart Native Assets.
version: 0.1.0
repository: https://github.com/mosuem/boring

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^1.0.0
  crypto: ^3.0.0
  ffi: ^2.0.0
  hooks: ^2.0.0
  meta: ^1.3.0
  native_toolchain_cmake: ^0.3.0

dev_dependencies:
  args: ^2.5.0
  dart_flutter_team_lints: ^3.5.0
  ffigen: ^21.0.0
  test: ^1.25.0

hooks:
  user_defines:
    boring:
      buildMode: checkout

topics:
  - crypto
  - security
