name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  dart-ci:
    name: Dart Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dependencies
        run: dart pub get

      - name: Verify Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Code
        run: dart analyze lib test tool hook example --fatal-infos

  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The tree-shaking test runs hook/link.dart, whose linker invocation
        # differs per OS.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Setup NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Install Dependencies
        run: dart pub get

      - name: Run Unit Tests
        run: dart test

  conformance:
    name: Project Wycheproof Conformance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dependencies
        run: dart pub get

      - name: Run Conformance Test Suite
        run: ./tool/run_conformance_tests.sh

  x509-limbo:
    name: x509-limbo Path Validation Conformance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dependencies
        run: dart pub get

      # limbo.json is ~40 MB, and the revision is pinned in the runner script.
      - name: Cache x509-limbo Testcases
        uses: actions/cache@v4
        with:
          path: build/x509-limbo
          key: x509-limbo-${{ hashFiles('tool/run_x509_limbo_tests.sh') }}

      - name: Run x509-limbo Test Suite
        run: ./tool/run_x509_limbo_tests.sh
