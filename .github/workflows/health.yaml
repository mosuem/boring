name: Health
permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  health:
    uses: dart-lang/ecosystem/.github/workflows/health.yaml@main
    with:
      ignore_coverage: "**.g.dart,**/example/**,**/hook/**,**/tool/**,**/hook_helpers/**"
      ignore_license: "**.g.dart"
      license_test_string: "// Copyright"
      license: |
        // Copyright %YEAR% Moritz Sümmermann. Licensed under the Apache License,
        // Version 2.0. See the LICENSE file for details.
    permissions:
      pull-requests: write
