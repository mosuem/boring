name: Release Prebuilt Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  precompile:
    name: Precompile (${{ matrix.os }} / ${{ matrix.target-os }}-${{ matrix.target-arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest available Ubuntu, so the libraries only require glibc
          # 2.35.
          - os: ubuntu-22.04
            target-os: linux
            target-arch: x64
          - os: ubuntu-22.04-arm
            target-os: linux
            target-arch: arm64
          - os: macos-14
            target-os: macos
            target-arch: arm64
          - os: macos-14
            target-os: macos
            target-arch: x64
          - os: windows-latest
            target-os: windows
            target-arch: x64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Setup NASM
        if: matrix.target-os == 'windows'
        uses: ilammy/setup-nasm@v1

      - name: Install Dependencies
        run: dart pub get

      # Builds the dynamic library, which is bundled when linking is disabled,
      # and the static library, which hook/link.dart links into a dynamic
      # library with only the functions an application uses.
      - name: Precompile Native Libraries
        run: dart run tool/precompile_binaries.dart --target-os=${{ matrix.target-os }} --target-arch=${{ matrix.target-arch }}

      - name: List Native Libraries
        run: ls -l bin

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target-os }}-${{ matrix.target-arch }}
          path: bin/*
          if-no-files-found: error

  publish-release:
    name: Attach Binaries to GitHub Release
    needs: precompile
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          if [ "$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets | length')" -eq 0 ]; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/*
          else
            echo "Release ${GITHUB_REF_NAME} already has assets; skipping upload to preserve recorded SHA-256 hashes."
          fi
